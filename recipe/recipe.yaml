schema_version: 1

context:
  version: "1.0.2"

package:
  name: pystac-ext-item-assets
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-item-assets/pystac_ext_item_assets-${{ version }}.tar.gz
  sha256: add715d7901538209d3510b1da0646e7bde0bf53146bb769dd71120daf8f891d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.item_assets
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Item Assets extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-item-assets/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
